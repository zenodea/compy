name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK parts
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        # The qa build is shrunk like a release, so a missing keep rule fails here and not on a phone.
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleQa
      - uses: actions/upload-artifact@v4
        with:
          name: compy-debug
          path: app/build/outputs/apk/debug/*.apk
